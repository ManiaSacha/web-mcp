[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Distribution name only. PyPI rejects "web-mcp" as too similar to the
# existing "webmcp" project — its check ignores separators. The repo, the
# Claude Code plugin, the module, and the web-mcp command are all unaffected.
name = "feed-mcp"
version = "0.2.1"
description = "Semantic search over RSS/news feeds for AI agents — a single-file MCP server, no API key, no cloud."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mania Sacha" }]
keywords = ["mcp", "rss", "atom", "news", "search", "agents", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
web-mcp = "web_mcp:main"
# Alias matching the distribution name, so either command works.
feed-mcp = "web_mcp:main"

[project.urls]
Homepage = "https://github.com/ManiaSacha/web-mcp"
Repository = "https://github.com/ManiaSacha/web-mcp"
Issues = "https://github.com/ManiaSacha/web-mcp/issues"
Changelog = "https://github.com/ManiaSacha/web-mcp/releases"

[tool.hatch.build.targets.wheel]
include = ["web_mcp.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "BLE", "C4", "RUF"]
ignore = [
    # The stopword list is a readable block of prose. Ruff wants a one-line
    # list literal of ~120 quoted strings, which is strictly worse to edit.
    "SIM905",
    # Suggests swapping xml.etree for defusedxml. ElementTree does not
    # resolve external entities, so XXE does not apply here, and entity
    # expansion is bounded by MAX_FETCH_BYTES. Taking the dependency would
    # break the stdlib-only constraint for no real gain. Reasoning and
    # limits are written up in docs/SECURITY-MODEL.md.
    "S314",
]
# BLE001 and S110 stay enabled so a *new* blind except gets caught. The few
# deliberate ones are marked with `# noqa` at the site, where the reason is
# visible to whoever reads the code.

[tool.ruff.lint.per-file-ignores]
# Tests use bare assert, and "0.0.0.0" appears as blocked-address test data
# rather than as a bind address.
"tests/*" = ["S101", "S104"]
