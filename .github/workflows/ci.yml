name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        # The fetch path builds sockets by hand and the install script is
        # per-platform, so both non-Linux runners are worth the minutes.
        include:
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test
        run: pytest -q

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: python -m pip install ruff

      - name: Ruff
        run: ruff check --output-format=github .

  package:
    name: build and validate distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check metadata
        run: python -m twine check dist/*

      # The plugin's .mcp.json invokes the `web-mcp` command, so a packaging
      # change that drops the entry point would break every plugin install
      # while leaving the tests green.
      - name: Verify console scripts are installable
        run: |
          python -m pip install dist/*.whl
          web-mcp --help > /dev/null
          feed-mcp --help > /dev/null
          echo "both console scripts work"

  manifests:
    name: validate plugin manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Claude Code discovers skills and agents by directory layout and
      # frontmatter name, and a typo there fails silently at install time
      # rather than loudly here.
      - name: Check manifests, frontmatter, and version sync
        run: python scripts/validate_plugin.py
